<!doctype html><meta charset="utf-8"><title>brand</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --gold:#f0c04a; --silk:#eef0e6; --board:#0c3328; }
  * { box-sizing:border-box; } body { margin:0; background:#222; font-family:'Barlow',sans-serif; }
  .pins { background:repeating-linear-gradient(90deg,var(--gold) 0 14px,transparent 14px 22px); }
  #og { width:1200px; height:630px; position:relative; overflow:hidden; color:var(--silk); background:#05090a url(/tools/og-scene.png) center/cover; }
  #og::before { content:''; position:absolute; inset:0; background:linear-gradient(90deg, rgba(5,9,10,.96) 0%, rgba(5,9,10,.88) 30%, rgba(5,9,10,.35) 48%, rgba(5,9,10,0) 62%), linear-gradient(0deg, rgba(5,9,10,.55) 0%, rgba(5,9,10,0) 28%); }
  #og .mark { position:absolute; left:68px; top:40px; width:74px; height:74px; }
  #og .word { position:absolute; left:68px; top:112px; font:700 172px/0.84 'Barlow Condensed',sans-serif; letter-spacing:-2px; text-shadow:0 6px 30px rgba(0,0,0,.5); }
  #og .word span { display:block; color:var(--gold); }
  #og .pins { position:absolute; left:72px; top:420px; width:380px; height:12px; }
  #og .tag { position:absolute; left:72px; top:450px; width:470px; font:500 28px/1.3 'Barlow',sans-serif; color:#d7e3dc; }
  #og .url { position:absolute; left:72px; bottom:28px; font:600 22px 'Barlow Condensed',sans-serif; letter-spacing:.1em; color:#9db4a8; }
  #logo { width:1200px; height:400px; display:flex; align-items:center; gap:44px; padding:0 80px; background:#05090a; color:var(--silk); }
  #logo img { width:230px; height:230px; } #logo .w { font:700 210px/0.78 'Barlow Condensed',sans-serif; letter-spacing:-2px; } #logo .w span { color:var(--gold); }
  #icon { background:#0c3328; } #icon img { display:block; width:100%; height:100%; }
</style>
<div id="og"><img class="mark" src="/mark.svg"><div class="word">RAM<span>HEIST</span></div><div class="pins"></div>
  <div class="tag">Sam says RAM belongs in datacenters. Hide yours for five nights.</div><div class="url">RAMA.GAJANANRATHOD.IN</div></div>
<div id="logo"><img src="/favicon.svg"><div class="w">RAM <span>HEIST</span></div></div>
<div id="icon"><img src="/favicon.svg"></div>
<script>
  const q = new URLSearchParams(location.search), kind = q.get('kind'), size = +q.get('size') || 512;
  for (const id of ['og','logo','icon']) document.getElementById(id).style.display = id === kind ? '' : 'none';
  const ic = document.getElementById('icon'); ic.style.width = ic.style.height = size + 'px';
  document.fonts.ready.then(() => { document.title = 'ready'; });
</script>
